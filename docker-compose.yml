version: '3.8'

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "3001:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend
    networks:
      - nerd3dbr-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"

    environment:
      - DB_MONGO_URI=mongodb://mongodb:27017/nerd3dbr
      - REDIS_URL=redis://redis:6379
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
      - JWT_SECRET=nerd3dbr_secret_key_change_in_production
    depends_on:
      - mongodb
      - redis
      - rabbitmq
    networks:
      - nerd3dbr-network

  mongodb:
    image: mongo:6.0
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - nerd3dbr-network

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    networks:
      - nerd3dbr-network

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - nerd3dbr-network

networks:
  nerd3dbr-network:
    driver: bridge

volumes:
  mongodb_data: